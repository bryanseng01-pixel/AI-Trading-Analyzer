[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-analyzer"
version = "0.1.0"
description = "Streamlit-based ICT market analysis assistant for futures."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "streamlit>=1.40,<2",
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "analysis_pipeline",
    "ai_market_coach",
    "app",
    "authority_market_story",
    "confluence",
    "dashboard",
    "data",
    "decision_authority",
    "decision_engine",
    "fair_value_gap",
    "fvg_lifecycle",
    "ict_playbook",
    "ifvg_integration",
    "indicators",
    "liquidity",
    "market_structure",
    "order_blocks",
    "order_block_engine",
    "order_block_integration",
    "order_flow_engines",
    "order_flow_integration",
    "order_flow_models",
    "order_flow_provider",
    "premium_discount_engine",
    "premium_discount_integration",
    "sessions",
    "setup_overlay",
    "structure",
    "timeframe_roles",
    "trade_checklist",
    "tradingview_chart",
    "volume_profile_engine",
    "volume_profile_integration",
]
